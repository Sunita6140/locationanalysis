<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Redirecting...</title>
    
    <!-- Meta Refresh Tag (0 seconds delay) -->
    <!-- Replace https://example.com with your target URL -->
    <meta http-equiv="refresh" content="0; url=https://locationanalytics.netlify.app/">
    
    <script>
        // JavaScript Redirect Backup
        window.location.href = "https://locationanalytics.netlify.app/";
    </script>
</head>
<body>
    <p>If you are not redirected automatically, <a href="https://locationanalytics.netlify.app/">click here</a>.</p>
</body>
</html>
